spring.application.name=Unifi-Webhook-To-Discord
# server.port defaults to env webui_port (or 45462), set in Application.main.
# Settings directory: property config.dir / env config_dir (default /config).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# Relative Location headers, so redirects keep the browser's scheme/host/port behind an HTTPS reverse proxy.
server.tomcat.use-relative-redirects=true
