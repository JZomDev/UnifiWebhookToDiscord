<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Change password')}"></head>
<body>
<div class="page">
	<th:block th:if="${forced}"><th:block th:replace="~{layout :: bareHeader(true)}"></th:block></th:block>
	<th:block th:unless="${forced}"><th:block th:replace="~{layout :: header('settings')}"></th:block></th:block>
	<form class="center" method="post" th:action="@{/change-password}">
		<input type="hidden" name="_csrf" th:value="${csrf}">
		<p class="mut" th:text="${forced} ? 'Choose a new password to continue' : 'Change password'">Choose a new password to continue</p>
		<p class="err" th:if="${error}" th:text="${error}">Error</p>
		<input name="password" type="password" placeholder="New password (at least 8 characters)" autocomplete="new-password" required minlength="8" autofocus>
		<input name="confirm" type="password" placeholder="Repeat" autocomplete="new-password" required minlength="8">
		<button type="submit" class="p" th:text="${forced} ? 'Save and continue' : 'Save'">Save and continue</button>
	</form>
</div>
</body>
</html>
